
services:
  mariadb:
    image: mariadb:11
    container_name: parcial01-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "Parcial2026_Root!"
      MARIADB_DATABASE: parcial01
      MARIADB_USER: estudiante
      MARIADB_PASSWORD: "Parcial2026_User!"
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
